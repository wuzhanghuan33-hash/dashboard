/* Header */

/* KPI Grid */
.kpi-grid { display:grid; gap:10px; }

<script>
// ==================== DATA LOADING ====================
let DB = null;
let CHART_INSTANCES = {};
let activeCat = '燃热';

function fmt(n) { return n==null?"—":Math.abs(n)>=10000?(n/10000).toFixed(1)+"万":n.toLocaleString(); }
function fmtPct(n) { return (n*100).toFixed(1)+"%"; }

function loadData() {
  DB = DASHBOARD_DATA;
  document.getElementById('headerSub').textContent = `数据源：飞书 天猫官旗业绩表 · 更新于 ${DB.lastUpdated}`;
  document.getElementById('footer').textContent = `数据更新于 ${DB.lastUpdated} · 飞书 天猫官旗业绩表`;
  init();
}

// ==================== DATA HELPERS ====================
function getAllDays() {
  const all = [];
  Object.keys(DB.months).sort().forEach(m => {
    const mo = DB.months[m];
    mo.days.forEach(d => {
      const date = `2026-${String(m).padStart(2,'0')}-${d.d}`;
      all.push({ date, month: parseInt(m), ...d });
    });
  });
  return all;
}

function calcLastYear(a, y) {
  // y is the 同比% change. last year value = a / (1 + y/100)
  if (y === 0 || y === null || y === undefined) return null;
  return Math.round(a / (1 + y / 100));
}

function lySales(d) {
  // 同期业绩(2025)：优先用飞书2025段提取的真值 ly_a；
  // 缺失（如 8/28-31 尚未补、9月无去年数据）时回退到前同比%反推，保持同期天数与当期对齐。
  if (d.ly_a !== null && d.ly_a !== undefined && d.ly_a > 0) return d.ly_a;
  return calcLastYear(d.a, d.y);
}

function lyNet(d) {
  // 同期剔退净额(2025)：真值 ly_post_refund 优先，缺则用剔退前同比 y_net 反推，
  // 与 lySales 同一口径，保证当期有净额的天总能对上同期，避免同比分母缺失。
  if (d.ly_post_refund !== null && d.ly_post_refund !== undefined && d.ly_post_refund > 0) return d.ly_post_refund;
  return calcLastYear(d.post_refund, d.y_net);
}

function lyCell(cur, ly, fmt) {
  // 同期值 + 同比 子行（指标单元格第二行）
  if (ly == null || ly === '') return '<span class="ly-val">同期 —</span>';
  const yoy = (cur != null && cur !== 0) ? (cur - ly) / ly * 100 : null;
  const yoyStr = (yoy != null && isFinite(yoy)) ? (yoy >= 0 ? '+' : '') + yoy.toFixed(1) + '%' : '—';
  const cls = (yoy == null || !isFinite(yoy)) ? '' : (yoy >= 0 ? 'good' : 'bad');
  return `<span class="ly-val">同期 ${fmt(ly)}</span> <span class="yoy ${cls}">同比 ${yoyStr}</span>`;
}

function filterDays(allDays, startStr, endStr) {
  const start = new Date(startStr);
  const end = new Date(endStr);
  return allDays.filter(d => {
    const dt = new Date(d.date);
    return dt >= start && dt <= end;
  });
}

function getDateRangeLabel(days) {
  if (!days.length) return "";
  const first = days[0].date, last = days[days.length-1].date;
  return `${first} ~ ${last} (共${days.length}天)`;
}

// ==================== RENDER ====================
function init() {
  const allDays = getAllDays();
  const firstDate = allDays[0].date;
  const lastDate = allDays[allDays.length-1].date;

  // Date inputs
  document.getElementById('startDate').value = firstDate;
  document.getElementById('endDate').value = lastDate;
  document.getElementById('startDate').min = firstDate;
  document.getElementById('endDate').max = lastDate;

  // Presets
  const presetsEl = document.getElementById('presets');
  presetsEl.innerHTML = '<button class="preset-btn" data-range="all">全部</button>';
  Object.keys(DB.months).sort().forEach(m => {
    const mo = DB.months[m];
    presetsEl.innerHTML += `<button class="preset-btn" data-range="m${m}">${mo.name}</button>`;
  });
  presetsEl.innerHTML += `<button class="preset-btn" data-range="h1">H1</button>`;
  presetsEl.innerHTML += `<button class="preset-btn" data-range="h2">H2</button>`;
  presetsEl.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      presetsEl.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const range = btn.dataset.range;
      if (range === 'all') { setDateRange(firstDate, lastDate); }
      else if (range === 'h1') { setDateRange('2026-01-01', '2026-06-30'); }
      else if (range === 'h2') { setDateRange('2026-07-01', lastDate); }
      else {
        const m = parseInt(range.slice(1));
        const start = `2026-${String(m).padStart(2,'0')}-01`;
        const end = `2026-${String(m).padStart(2,'0')}-${String(new Date(2026,m,0).getDate()).padStart(2,'0')}`;
        setDateRange(start, end);
      }
    });
  });

  // Preselect "全部"
  document.querySelector('[data-range="all"]').classList.add('active');

  // Event listeners
  document.getElementById('startDate').addEventListener('change', updateFromDates);
  document.getElementById('endDate').addEventListener('change', updateFromDates);

  // Category tabs
  initCategoryTabs();

  // Auto-refresh
  let refreshTimer;
  document.getElementById('autoRefresh').addEventListener('change', function() {
    if (this.checked) {
      refreshTimer = setInterval(() => {
        document.getElementById('updateTime').textContent = `🔄 ${new Date().toLocaleTimeString()}`;
        // In future, re-fetch data.json here
      }, 60000);
    } else {
      clearInterval(refreshTimer);
    }
  });

  renderAll();
}

function setDateRange(start, end) {
  document.getElementById('startDate').value = start;
  document.getElementById('endDate').value = end;
  renderAll();
}

function updateFromDates() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  renderAll();
}

function renderAll() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const allDays = getAllDays();
  const days = filterDays(allDays, start, end);

  renderCategory();

  if (!days.length) {
    document.getElementById('kpiOverview').innerHTML = '<div class="kpi-card"><div class="label">⚠️</div><div class="value">无数据</div><div class="sub">请选择其他日期范围</div></div>';
    return;
  }

  renderOverview(days);
  renderRefundKPI(days);
  renderTrafficKPI(days);
  renderCompare(days);
  renderMonthlyChart(days);
  renderRateChart(days);
  renderTrafficChart(days);
  renderAOVChart(days);
  renderCartChart(days);
  renderYoYChart(days);
  renderInsights(days);
  renderTable(days);
  document.getElementById('tableCount').textContent = getDateRangeLabel(days);
}

// ==================== SECTION: 经营概览 ====================
function renderOverview(days) {
  const totalT = days.reduce((s,r) => s+r.t, 0);
  const totalA = days.reduce((s,r) => s+r.a, 0);
  const rate = totalA / totalT;
  const daysAbove = days.filter(r => r.rr >= 1).length;

  // 同期 total（ly_a 真值优先，缺则前同比%反推兜底；同比仅对比双方都有值的天）
  let totalLastYear = 0, matchedA = 0, matchedDays = 0;
  days.forEach(d => {
    const ly = lySales(d);
    if (ly !== null) { totalLastYear += ly; matchedA += d.a; matchedDays++; }
  });

  // 剔退净额与同比（同期仅累计当期有净额的天，避免未过完月份的未来天虚增分母）
  const postDays = days.filter(r => r.post_refund !== null && r.post_refund !== undefined && r.post_refund > 0);
  const hasPostRefund = postDays.length > 0;
  const totalPostRefund = hasPostRefund ? postDays.reduce((s,r) => s + r.post_refund, 0) : 0;
  // 去退金额目标合计（分母与达成率同一口径；缺目标的月末天按 0 计）
  const totalPostT = days.reduce((s,r) => s + (r.post_refund_t||0), 0);
  const refundLoss = totalA - totalPostRefund;
  // 剔退净额同比：真值 ly_post_refund 优先、缺(9月暂无去年净额字段)用剔退前同比%反推，
  // 当期/同期每天一一对应(同比分子用有同期的天)，避免当期有、同期无的天虚增
  const netMatched = postDays.filter(r => lyNet(r) !== null);
  const totalNetMatched = netMatched.reduce((s,r) => s + r.post_refund, 0);
  const hasNetYoY = netMatched.length > 0;
  let totalLyPostRefund = 0, netYearOverYear = null;
  if (hasNetYoY) {
    totalLyPostRefund = netMatched.reduce((s,r) => s + lyNet(r), 0);
    if (totalLyPostRefund > 0) netYearOverYear = ((totalNetMatched - totalLyPostRefund) / totalLyPostRefund * 100).toFixed(1);
  }

  const el = document.getElementById('kpiOverview');
  el.innerHTML = `
    <div class="kpi-card" style="border-left-color:#3b82f6"><div class="label">业绩目标</div><div class="value">${fmt(totalT)}</div><div class="sub">${days.length}天</div></div>
    <div class="kpi-card" style="border-left-color:#16a34a"><div class="label">业绩达成</div><div class="value">${fmt(totalA)}</div><div class="sub ${rate>=.85?'good':'bad'}">${totalA>=totalT?'超额 '+fmt(totalA-totalT):'差额 '+fmt(totalA-totalT)}</div></div>
    <div class="kpi-card" style="border-left-color:${rate>=1?'#16a34a':rate>=.8?'#d97706':'#dc2626'}"><div class="label">达成率</div><div class="value" style="color:${rate>=1?'#16a34a':rate>=.8?'#d97706':'#dc2626'}">${fmtPct(rate)}</div><div class="sub">超目标 ${daysAbove}/${days.length} 天</div></div>
    ${totalLastYear>0?`<div class="kpi-card" style="border-left-color:#8b5cf6"><div class="label">同期业绩（2025）</div><div class="value">${fmt(totalLastYear)}</div><div class="sub ${matchedA>=totalLastYear?'good':'bad'}">同比 ${((matchedA/totalLastYear-1)*100).toFixed(1)}%（${matchedDays}天可比）</div></div>`:''}
    ${hasPostRefund?`<div class="kpi-card" style="border-left-color:#f97316"><div class="label">净达成（剔退）</div><div class="value">${fmt(totalPostRefund)}</div><div class="sub ${netYearOverYear!==null?(parseFloat(netYearOverYear)>=0?'good':'bad'):''}">剔退 ${fmt(refundLoss)} | 净达成率 ${totalPostT>0?fmtPct(totalPostRefund/totalPostT):'—'}${netYearOverYear!==null?' | 同比 '+netYearOverYear+'%':''}</div></div>`:''}
  `;
}

// ==================== SECTION: 资金与退款 ====================
function renderRefundKPI(days) {
  const actualDays = days.filter(d => d.a > 0);
  const hasRefundAmt = actualDays.some(r => r.refund_amt !== undefined);
  const totalA = actualDays.reduce((s,r) => s+r.a, 0);
  const totalRefundAmt = hasRefundAmt ? actualDays.reduce((s,r) => s + (r.refund_amt||0), 0) : 0;
  const totalPostRefund = hasRefundAmt ? actualDays.reduce((s,r) => s + (r.post_refund||0), 0) : 0;
  const avgRef = totalA ? totalRefundAmt / totalA * 100 : 0;
  const maxRef = actualDays.length ? Math.max(...actualDays.map(r => r.ref||0)) : 0;

  // 退款率目标
  const refDays = actualDays.filter(r => r.ref_t !== undefined && r.ref_t > 0);
  const avgRefTarget = refDays.length ? refDays.reduce((s,r) => s+r.ref_t, 0) / refDays.length : null;

  const el = document.getElementById('kpiRefund');
  el.innerHTML = `
    <div class="kpi-card" style="border-left-color:#ef4444"><div class="label">平均退款率${avgRefTarget!==null?' (目标 '+avgRefTarget.toFixed(1)+'%)':''}</div><div class="value" style="color:${avgRef>35?'#dc2626':'#16a34a'}">${avgRef.toFixed(1)}%</div><div class="sub">最高 ${maxRef.toFixed(1)}% ${avgRefTarget!==null?'· '+(avgRef<=avgRefTarget?'达标':'超标 '+(avgRef-avgRefTarget).toFixed(1)+'pp'):''}</div></div>
    ${hasRefundAmt?`
    <div class="kpi-card" style="border-left-color:#f97316"><div class="label">退款金额</div><div class="value" style="color:#dc2626">${fmt(totalRefundAmt)}</div><div class="sub">占达成 ${(totalRefundAmt/totalA*100).toFixed(1)}%</div></div>
    <div class="kpi-card" style="border-left-color:#16a34a"><div class="label">去退金额</div><div class="value">${fmt(totalPostRefund)}</div><div class="sub">剔除退款后净额</div></div>
    `:'<div class="kpi-card" style="border-left-color:#94a3b8"><div class="label">注</div><div class="value" style="font-size:13px">本区间无退款明细</div><div class="sub">7月起开始记录</div></div>'}
  `;
}

// ==================== SECTION: 流量与转化 ====================
function renderTrafficKPI(days) {
  const actualDays = days.filter(d => d.a > 0);
  const totalA = actualDays.reduce((s,r) => s+r.a, 0);
  const totalB = actualDays.reduce((s,r) => s+r.b, 0);
  const totalV = actualDays.reduce((s,r) => s+r.v, 0);
  const avgAov = totalB ? Math.round(totalA / totalB) : 0;
  const maxAov = actualDays.length ? Math.max(...actualDays.map(r => r.aov)) : 0;
  const hasCart = actualDays.some(r => r.cart_users !== undefined);
  const totalCart = hasCart ? actualDays.reduce((s,r) => s + (r.cart_users||0), 0) : 0;
  const avgCr = hasCart && totalV ? (totalCart / totalV * 100).toFixed(1) : '—';
  const totalT = actualDays.reduce((s,r) => s+r.t, 0);

  // 目标值
  const hasVTarget = actualDays.some(r => r.v_t > 0);
  const totalVTarget = hasVTarget ? actualDays.reduce((s,r) => s + (r.v_t||0), 0) : 0;
  const vRate = hasVTarget && totalVTarget > 0 ? (totalV / totalVTarget * 100).toFixed(1) : null;
  const hasBTarget = actualDays.some(r => r.b_t > 0);
  const totalBTarget = hasBTarget ? actualDays.reduce((s,r) => s + (r.b_t||0), 0) : 0;
  const bRate = hasBTarget && totalBTarget > 0 ? (totalB / totalBTarget * 100).toFixed(1) : null;
  const hasAovTarget = actualDays.some(r => r.aov_t > 0);
  // 周期目标客单价 = 总目标业绩 / 总目标买家（口径一致）
  const periodTargetAov = hasAovTarget && totalBTarget > 0 ? totalT / totalBTarget : null;
  const hasCartTarget = actualDays.some(r => r.cart_users_t > 0);
  const totalCartTarget = hasCartTarget ? actualDays.reduce((s,r) => s + (r.cart_users_t||0), 0) : 0;
  const cartRate = hasCartTarget && totalCartTarget > 0 ? (totalCart / totalCartTarget * 100).toFixed(1) : null;

  // 同期(2025) 同比 —— 匹配天口径：当期与同期双端都有值的天才计入。
  // 流量指标无前同比字段可反推（9月尚无 ly_v/ly_b/ly_cart），故剔除无去年值的当期天，
  // 避免当期有、同期无而把同比虚高
  const matchedDays = (curKey, lyKey) => actualDays.filter(d => (d[curKey]||0) > 0 && (d[lyKey]||0) > 0);
  const sumK = (arr, k) => arr.reduce((s,r) => s + (r[k]||0), 0);
  const yoyPct = (cur, ly) => (ly > 0 && cur > 0) ? (cur/ly-1)*100 : null;
  const vM = matchedDays('v','ly_v'), bM = matchedDays('b','ly_b'), cartM = matchedDays('cart_users','ly_cart_users');
  const vYoy = yoyPct(sumK(vM,'v'), sumK(vM,'ly_v'));
  const bYoy = yoyPct(sumK(bM,'b'), sumK(bM,'ly_b'));
  const cartYoy = yoyPct(sumK(cartM,'cart_users'), sumK(cartM,'ly_cart_users'));
  // 客单价/转化率同样按匹配天的聚合值比较，避免分母少一段
  const aovM = matchedDays('a','ly_a').filter(d => (d.b||0) > 0 && (d.ly_b||0) > 0);
  const lyAvgAov = aovM.length && sumK(aovM,'ly_b') > 0 ? sumK(aovM,'ly_a')/sumK(aovM,'ly_b') : null;
  const curAvgAov = aovM.length && sumK(aovM,'b') > 0 ? sumK(aovM,'a')/sumK(aovM,'b') : null;
  const aovYoy = (lyAvgAov > 0 && curAvgAov > 0) ? (curAvgAov/lyAvgAov-1)*100 : null;
  // 转化率 = 买家/访客（当期值用全部天展示；同比用双端匹配天）
  const conv = (totalV > 0) ? totalB/totalV : null;
  const cvM = matchedDays('b','ly_b').filter(d => (d.v||0) > 0 && (d.ly_v||0) > 0);
  const curConvM = sumK(cvM,'v') > 0 ? sumK(cvM,'b')/sumK(cvM,'v') : null;
  const lyConv = sumK(cvM,'ly_v') > 0 ? sumK(cvM,'ly_b')/sumK(cvM,'ly_v') : null;
  const convYoy = (curConvM && lyConv) ? (curConvM/lyConv-1)*100 : null;
  const convTargetDays = actualDays.filter(r => r.conv_t > 0);
  const convTarget = convTargetDays.length ? convTargetDays.reduce((s,r) => s+r.conv_t, 0)/convTargetDays.length : null;
  const convRate = (conv && convTarget) ? (conv/convTarget*100).toFixed(1) : null;
  const yoySub = v => v===null||v===undefined ? '' : ' · <span class="'+(v>=0?'good':'bad')+'">同比 '+(v>=0?'+':'')+v.toFixed(1)+'%</span>';

  const el = document.getElementById('kpiTraffic');
  el.innerHTML = `
    <div class="kpi-card" style="border-left-color:#f59e0b"><div class="label">访客数${vRate!==null?' · 目标达成 '+vRate+'%':''}</div><div class="value">${totalV>=10000?(totalV/10000).toFixed(1)+'万':totalV.toLocaleString()}</div><div class="sub">日均 ${(totalV/actualDays.length).toFixed(1)}${hasVTarget?' · 目标 '+fmt(totalVTarget):''}${yoySub(vYoy)}</div></div>
    <div class="kpi-card" style="border-left-color:#f97316"><div class="label">买家数${bRate!==null?' · 目标达成 '+bRate+'%':''}</div><div class="value">${totalB.toLocaleString()}</div><div class="sub">日均 ${Math.round(totalB/actualDays.length).toLocaleString()}${hasBTarget?' · 目标 '+fmt(totalBTarget):''}${yoySub(bYoy)}</div></div>
    <div class="kpi-card" style="border-left-color:#10b981"><div class="label">转化率${convRate!==null?' · 目标达成 '+convRate+'%':''}</div><div class="value">${conv!==null?(conv*100).toFixed(2)+'%':'—'}</div><div class="sub">买家/访客${convTarget!==null?' · 目标 '+(convTarget*100).toFixed(2)+'%':''}${yoySub(convYoy)}</div></div>
    <div class="kpi-card" style="border-left-color:#06b6d4"><div class="label">客单价${periodTargetAov!==null?' · 目标达成 '+(avgAov/periodTargetAov*100).toFixed(2)+'%':''}</div><div class="value">${avgAov.toLocaleString()}</div><div class="sub">最高 ${maxAov.toLocaleString()}${periodTargetAov!==null?' · 目标 '+periodTargetAov.toFixed(2)+'元':''}${yoySub(aovYoy)}</div></div>
    ${hasCart?`<div class="kpi-card" style="border-left-color:#8b5cf6"><div class="label">加购人数${cartRate!==null?' · 目标达成 '+cartRate+'%':''}</div><div class="value">${totalCart>=10000?(totalCart/10000).toFixed(1)+'万':totalCart.toLocaleString()}</div><div class="sub">日均 ${(totalCart/actualDays.length).toFixed(1)} · 加购率 ${avgCr}%${hasCartTarget?' · 目标 '+fmt(totalCartTarget):''}${yoySub(cartYoy)}</div></div>`:'<div class="kpi-card" style="border-left-color:#94a3b8"><div class="label">加购数据</div><div class="value" style="font-size:13px">本区间无</div><div class="sub">部分月份未记录</div></div>'}
  `;
}

// ==================== 同比对比 ====================
function renderCompare(days) {
  let hasLastYear = false;
  let totalA = 0, totalLy = 0;

  days.forEach(d => {
    const ly = lySales(d);
    if (ly !== null) { hasLastYear = true; totalA += d.a; totalLy += ly; }
  });

  // Net YoY（当期有净额且能取到 2025 同期净额的天；缺真值用剔退前同比%反推）
  const netDays = days.filter(d => d.post_refund !== null && d.post_refund !== undefined && d.post_refund > 0 && lyNet(d) !== null);
  const hasNetYoY = netDays.length > 0;
  let totalNet = 0, totalLyNet = 0;
  netDays.forEach(d => {
    totalNet += d.post_refund;
    totalLyNet += lyNet(d);
  });

  const el = document.getElementById('compareGrid');

  if (!hasLastYear && !hasNetYoY) {
    el.innerHTML = '';
    return;
  }

  const yoySales = hasLastYear ? ((totalA / totalLy - 1) * 100).toFixed(1) : null;
  const yoyNet = hasNetYoY && totalLyNet > 0 ? ((totalNet / totalLyNet - 1) * 100).toFixed(1) : null;

  el.innerHTML = `
    ${hasLastYear?`<div class="compare-card">
      <h4>GMV 同比（2025）</h4>
      <div class="stat"><span>2026 达成</span><span class="val">${fmt(totalA)}</span></div>
      <div class="stat"><span>2025 同期</span><span class="val">${fmt(totalLy)}（真值/前同比反推）</span></div>
      <div class="stat"><span>同比增长</span><span class="val ${parseFloat(yoySales)>=0?'good':'bad'}">${yoySales}%</span></div>
      <div class="stat"><span>差额</span><span class="val ${parseFloat(yoySales)>=0?'good':'bad'}">${totalA>=totalLy?'+':''}${fmt(totalA-totalLy)}</span></div>
    </div>`:''}
    ${hasNetYoY?`<div class="compare-card">
      <h4>剔退后净额同比（2025）</h4>
      <div class="stat"><span>2026 去退净额</span><span class="val">${fmt(totalNet)}</span></div>
      <div class="stat"><span>2025 去退净额</span><span class="val">${fmt(totalLyNet)}（真值/前同比反推）</span></div>
      <div class="stat"><span>同比增长</span><span class="val ${parseFloat(yoyNet)>=0?'good':'bad'}">${yoyNet}%</span></div>
      <div class="stat"><span>差额</span><span class="val ${parseFloat(yoyNet)>=0?'good':'bad'}">${totalNet>=totalLyNet?'+':''}${fmt(totalNet-totalLyNet)}</span></div>
    </div>`:''}
    <div class="compare-card">
      <h4>增长幅度</h4>
      <div class="stat"><span>GMV 增长天数</span><span class="val good">${hasLastYear?days.filter(d=>{const ly=lySales(d);return ly!==null&&d.a>ly;}).length:0}天</span></div>
      <div class="stat"><span>GMV 下降天数</span><span class="val bad">${hasLastYear?days.filter(d=>{const ly=lySales(d);return ly!==null&&d.a<ly;}).length:0}天</span></div>
      <div class="stat"><span>剔退最高同比</span><span class="val good">${(()=>{const v=days.filter(d=>d.y_net!==null&&d.y_net>0).map(d=>d.y_net);return v.length?Math.max(...v).toFixed(1):'—';})()}%</span></div>
      <div class="stat"><span>剔退最低同比</span><span class="val bad">${(()=>{const v=days.filter(d=>d.y_net!==null&&!isNaN(d.y_net)).map(d=>d.y_net);return v.length?Math.min(...v).toFixed(1):'—';})()}%</span></div>
    </div>
    <div class="compare-card">
      <h4>备注</h4>
      <div style="font-size:10px;color:#64748b;line-height:1.6">
        GMV 同期以飞书 2025 段真值 ly_a 为准，缺失天用前同比%反推；<br>
        剔退净额同期以真值 ly_post_refund 为准，缺失天（9月暂无去年字段）用剔退前同比%反推；<br>
        流量指标（访客/买家/加购/转化）同期无双端值的天不计入，避免同比虚高；<br>
        春节期间同比暴涨（1月底-2月初）因2025年春节在1月底，存在错位。
      </div>
    </div>
  `;
}

// ==================== CHARTS ====================
function renderMonthlyChart(days) {
  if (typeof Chart === 'undefined') return;
  // 按月份聚合选中日期范围的天数
  const byMonth = {};
  days.forEach(r => {
    if (!byMonth[r.month]) byMonth[r.month] = { t:0, a:0, ly:0, lyDays:0, pst:0, pst_t:0 };
    const b = byMonth[r.month];
    b.t += r.t || 0;
    b.a += r.a || 0;
    b.pst += r.post_refund || 0;
    b.pst_t += r.post_refund_t || 0;
    const ly = lySales(r);
    if (ly != null) { b.ly += ly; b.lyDays++; }
  });
  const months = Object.keys(byMonth).sort((a,b)=>a-b);
  const labels = months.map(m => m + '月');
  const ctx = document.getElementById('monthlyChart').getContext('2d');
  if (CHART_INSTANCES.monthly) CHART_INSTANCES.monthly.destroy();

  const tData = months.map(m => byMonth[m].t);
  const aData = months.map(m => byMonth[m].a);
  const lyData = months.map(m => byMonth[m].lyDays ? Math.round(byMonth[m].ly) : null);
  const rrData = months.map(m => byMonth[m].t ? Math.round(byMonth[m].a / byMonth[m].t * 1000) / 10 : null);
  const pstData = months.map(m => byMonth[m].pst);
  const pstRateData = months.map(m => byMonth[m].pst_t ? Math.round(byMonth[m].pst / byMonth[m].pst_t * 1000) / 10 : null);

  CHART_INSTANCES.monthly = new Chart(ctx, {
    type:'bar',
    data:{
      labels,
      datasets:[
        {label:'目标',data:tData,backgroundColor:'rgba(26,35,126,.12)',borderColor:'rgba(26,35,126,.25)',borderWidth:1,borderRadius:2,order:3},
        {label:'达成',data:aData,backgroundColor:'rgba(18,183,106,.45)',borderColor:'#12b76a',borderWidth:1,borderRadius:2,order:3},
        {label:'净达成(剔退)',data:pstData,backgroundColor:'rgba(217,70,239,.35)',borderColor:'#d946ef',borderWidth:1,borderRadius:2,order:3},
        {label:'同期(2025)',data:lyData,backgroundColor:'rgba(152,162,179,.3)',borderColor:'#98a2b3',borderWidth:1,borderRadius:2,order:3,type:'bar'},
        {label:'达成率',data:rrData,type:'line',borderColor:'#f79009',backgroundColor:'rgba(247,144,9,.1)',fill:true,pointRadius:2,pointHoverRadius:5,borderWidth:2,tension:.3,yAxisID:'y1',order:1},
        {label:'净达成率',data:pstRateData,type:'line',borderColor:'#d946ef',borderDash:[4,3],backgroundColor:'rgba(217,70,239,.08)',fill:false,pointRadius:2,pointHoverRadius:5,borderWidth:2,tension:.3,yAxisID:'y1',order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9}}},
        y:{type:'linear',position:'left',title:{display:true,text:'销售额(元)',font:{size:9}},ticks:{callback:v=>v>=10000?(v/10000)+'万':v,font:{size:9}}},
        y1:{type:'linear',position:'right',min:0,max:Math.max(...(rrData.concat(pstRateData).filter(v=>v!=null)),0)*1.3,grid:{display:false},title:{display:true,text:'达成率(%)',font:{size:9}},ticks:{callback:v=>v+'%',font:{size:9}}}
      }
    }
  });
}

function renderRateChart(days) {

  const labels = days.map(r => r.date.slice(5));
  const ctx = document.getElementById('rateChart').getContext('2d');
  if (CHART_INSTANCES.rate) CHART_INSTANCES.rate.destroy();

        {label:'退款率',data:days.map(r=>r.ref!==null?r.ref:null),borderColor:'#f04438',backgroundColor:'rgba(240,68,56,.1)',fill:true,pointRadius:2,tension:.3,borderWidth:2,spanGaps:false},
        {label:'退款率同期(2025)',data:days.map(r=>r.ly_ref??null),borderColor:'#98a2b3',backgroundColor:'transparent',borderDash:[4,4],pointRadius:0,tension:.3,borderWidth:1.5,spanGaps:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},maxTicksLimit:15}},

// ==================== INSIGHTS ====================
function renderInsights(days) {
  const totalA = days.reduce((s,r) => s+r.a, 0);
  const totalT = days.reduce((s,r) => s+r.t, 0);
  const rate = totalA / totalT;
  const topDay = days.reduce((best, d) => d.a > best.a ? d : best, days[0]);
  const lowDay = days.reduce((worst, d) => d.rr < worst.rr ? d : worst, days[0]);
  const highAov = days.reduce((best, d) => d.aov > best.aov ? d : best, days[0]);
  const refVals = days.filter(r => r.ref !== null);
  const avgRef = refVals.length ? refVals.reduce((s,r) => s+r.ref, 0) / refVals.length : 0;
  const highRef = refVals.length ? refVals.reduce((worst, d) => d.ref > worst.ref ? d : worst, refVals[0]) : null;

  const items = [];
  if (days.length >= 7) {
    const first7 = days.slice(0,7), last7 = days.slice(-7);
    const first7avg = first7.reduce((s,r)=>s+r.a,0)/7;
    const last7avg = last7.reduce((s,r)=>s+r.a,0)/7;
    const trend = ((last7avg/first7avg-1)*100).toFixed(1);
    items.push({text:`近7天日均${fmt(last7avg)}`+(trend>=0?`, 较前期增长${trend}%`:(trend.startsWith('-')?`, 较前期${trend}%`:`, 较前期下降${Math.abs(parseFloat(trend))}%`)),cls:parseFloat(trend)>=0?'pos':'neg'});
  }
  items.push({text:`单日最高：${topDay.date.slice(5)} 达成 ${fmt(topDay.a)}（达成率${fmtPct(topDay.rr)}）`,cls:'pos'});
  items.push({text:`单日最低：${lowDay.date.slice(5)} 达成率仅 ${fmtPct(lowDay.rr)}（${fmt(lowDay.a)}）`,cls:'neg'});
  items.push({text:`最高客单价：${highAov.date.slice(5)} 达 ${highAov.aov}元/单`,cls:'pos'});
  if (avgRef > 30 && highRef) items.push({text:`退款率偏高（均值${avgRef.toFixed(1)}%），需关注${highRef.date.slice(5)}达${highRef.ref}%`,cls:'neg'});
  if (rate >= 1) items.push({text:`期间达成率${fmtPct(rate)}，整体超额完成`,cls:'pos'});
  else items.push({text:`期间达成率${fmtPct(rate)}，未达目标，差额${fmt(totalT-totalA)}`,cls:'neg'});

  const el = document.getElementById('insights');
  el.innerHTML = `<h3>区间分析</h3><ul>${items.map(i => `<li class="${i.cls}">${i.text}</li>`).join('')}</ul>`;
}

function initCategoryTabs() {
  document.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      renderCategory();
    });

function getCatDays(cat, startStr, endStr) {
  const list = CATEGORY_DATA[cat] || [];
  const start = new Date(startStr), end = new Date(endStr);
  return list.filter(d => {
    const dt = new Date('2026-' + d.d);
    return dt >= start && dt <= end;
  });
}

function renderCategory() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const days = getCatDays(activeCat, start, end);
  renderCatKPI(days);
  renderCatChart(days);
  renderCatTable(days);
}

function renderCatKPI(days) {
  const totalT = days.reduce((s,r) => s + (r.t||0), 0);
  const totalA = days.reduce((s,r) => s + (r.a||0), 0);
  const rate = totalT ? totalA/totalT : 0;
  const hasRefund = days.some(r => r.refund !== null && r.refund !== undefined);
  const totalRefund = hasRefund ? days.reduce((s,r) => s + (r.refund||0), 0) : 0;
  const hasPost = days.some(r => r.post !== null && r.post !== undefined);
  const totalPost = hasPost ? days.reduce((s,r) => s + (r.post||0), 0) : 0;
  // 同比按日期对齐：同期仅累计当期有达成/净额的天，避免未过完月份的未来天虚增分母
  const aDays = days.filter(r => r.a !== null && r.a !== undefined && r.a > 0);
  const postDays = days.filter(r => r.post !== null && r.post !== undefined && r.post > 0);
  const hasLy = aDays.some(r => r.ly_a !== null && r.ly_a !== undefined);
  const totalLy = hasLy ? aDays.reduce((s,r) => s + (r.ly_a||0), 0) : 0;
  const lyYoy = (hasLy && totalLy > 0 && totalA > 0) ? ((totalA/totalLy-1)*100) : null;
  // 去退金额同期(2025)同比
  const hasLyPost = postDays.some(r => r.ly_post !== null && r.ly_post !== undefined);
  const totalLyPost = hasLyPost ? postDays.reduce((s,r) => s + (r.ly_post||0), 0) : 0;
  const postLyYoy = (hasLyPost && totalLyPost > 0 && totalPost > 0) ? ((totalPost/totalLyPost-1)*100) : null;
  const yoyStr = v => (v===null||v===undefined) ? '' : '同比 '+(v>=0?'+':'')+v.toFixed(1)+'%';
  const el = document.getElementById('catKPI');
  el.innerHTML = `
    <div class="kpi-card" style="border-left-color:#3b82f6"><div class="label">业绩目标</div><div class="value">${fmt(totalT)}</div><div class="sub">${days.length}天</div></div>
    <div class="kpi-card" style="border-left-color:#16a34a"><div class="label">业绩达成</div><div class="value">${fmt(totalA)}</div><div class="sub ${totalA>=totalT?'good':'bad'}">${totalA>=totalT?'超额 '+fmt(totalA-totalT):'差额 '+fmt(totalA-totalT)}${lyYoy!==null?' · '+yoyStr(lyYoy):''}</div></div>
    <div class="kpi-card" style="border-left-color:${rate>=1?'#16a34a':rate>=.8?'#d97706':'#dc2626'}"><div class="label">达成率</div><div class="value" style="color:${rate>=1?'#16a34a':rate>=.8?'#d97706':'#dc2626'}">${fmtPct(rate)}</div><div class="sub">目标口径</div></div>
    ${hasLy?`<div class="kpi-card" style="border-left-color:#8b5cf6"><div class="label">同期业绩（2025）</div><div class="value">${fmt(totalLy)}</div><div class="sub ${lyYoy!==null&&lyYoy>=0?'good':'bad'}">${yoyStr(lyYoy)}</div></div>`:''}
    ${hasRefund?`<div class="kpi-card" style="border-left-color:#ef4444"><div class="label">退款金额</div><div class="value" style="color:#dc2626">${fmt(totalRefund)}</div><div class="sub">占达成 ${totalA?fmtPct(totalRefund/totalA):'—'}</div></div>`:''}
    ${hasPost?`<div class="kpi-card" style="border-left-color:#f97316"><div class="label">去退金额</div><div class="value">${fmt(totalPost)}</div><div class="sub ${postLyYoy!==null&&postLyYoy>=0?'good':'bad'}">剔除退款后净额${postLyYoy!==null?' · '+yoyStr(postLyYoy):''}</div></div>`:''}
  `;
}

    </tr>`;
  }).join('');
  el.innerHTML = `
    <div class="cat-table-toggle" onclick="toggleCatDetail()">逐日明细 <small>${days.length}天 · 达成/去退第二行=2025同期·同比</small><span class="caret" id="catDetailCaret">${catDetailOpen?'▾':'▸'}</span></div>
    <div class="cat-table-body" id="catDetailBody" style="${catDetailOpen?'':'display:none'}">
      <table><thead><tr>
        <th>日期</th><th>节奏</th><th>目标</th><th>达成</th><th>达成率</th><th>退款金额</th><th>去退金额</th>
      </tr></thead><tbody>${rows}</tbody></table>
    </div>`;
}

// ==================== START ====================
loadData();
// Chart.js 异步加载完成后重绘图表
(function retryCharts(){if(typeof Chart!=='undefined'){renderAll();}else{setTimeout(retryCharts,500);}})();
</script>
